  rationale: >-
    The password-reset key is checked at 90 against md5(login) - a value anyone can compute from
    the username alone. There is no secret, no expiry and no state, so knowing a login is enough
    to reset that account's password. The reset actions carry no authentication interceptor in
    struts.xml, so this is reachable unauthenticated.
