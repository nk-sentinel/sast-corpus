evidence:
  source: walkthrough
  rationale: >-
    This looks like the textbook IDOR and is not one. userId is a request-bound action property
    - UserEdit.jsp submits it as a hidden field (22) - so a tainted value does reach the field.
    But the first thing edit() does is overwrite it from the session at 76, before the lookup at
    88, and the action is behind the authentication interceptor in struts.xml, so the session
    user is always present. The attacker-supplied id is dead by the time it is used. A tool that
    follows the parameter into userService.find without modelling the overwrite reports a false
    positive.
