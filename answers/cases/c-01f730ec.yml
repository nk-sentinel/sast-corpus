  rationale: >-
    ProductAction exposes a whole Product entity as an action property, so Struts' parameter
    interceptor binds any product.* request parameter onto it, including product.id, and the
    object is persisted wholesale at 86. The form declares the id as a hidden field
    (ProductEdit.jsp 26), so the client chooses which row it overwrites; nothing checks which
    product was actually being edited.
