evidence:
  source: hand-authored
  rationale: >-
    The taint source is a Spring MVC binding, not a call: `code` is populated by
    the framework from the URL path via @PathVariable, so a tool has to model
    Spring's request binding to see any input at all. It then crosses into a
    separate @Service class and is concatenated into the SQL string passed to
    JdbcTemplate.queryForObject. Nothing escapes or binds it. Tools that only
    recognise explicit source calls such as request.getParameter miss this
    entirely, which is precisely what the case is here to measure.
