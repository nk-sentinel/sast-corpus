  rationale: >-
    The address request parameter reaches doExecCommand and is concatenated into the third
    element of the command array at 45, which is then run at 46. The array form is what makes
    this worth a case: the arguments are a vector, so the usual 'passes an argv, therefore safe'
    heuristic says clean - but element [1] is -c and element [2] is a shell script, so /bin/bash
    parses the concatenated value and 1.2.3.4; id runs id. Argument-vector form is not a defence
    when the interpreter being invoked is a shell.
