  rationale: >-
    adminShowUsers decides administrator status by reading a cookie named admin and comparing it
    to "1" (39-46), then returns every user's id, login, email and role. The cookie is set by
    nobody and trusted by the server, so sending admin=1 is the whole attack. The action sits in
    the api package (struts.xml 158), which carries no authentication interceptor, so no login
    is needed either.
