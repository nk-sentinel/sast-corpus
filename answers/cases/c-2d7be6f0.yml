  rationale: >-
    Deliberate trap, and a close mirror of c-9c3ade14. A @PathVariable crosses
    into a @Service and the SQL string is still built by concatenation, so the
    surface pattern a matcher keys on is present. But the only concatenated
    value is a private static constant, and the user-controlled `code` is passed
    as a bound parameter in the varargs argument to queryForObject. A tool that
    flags string-built SQL without checking what was concatenated reports this,
    and that is a false positive.
