evidence:
  source: walkthrough
  rationale: >-
    slug webgoat-path-retrieval@decode-after-check. The guard at 94-96 tests
    request.getQueryString(), which is the raw query string, but the value reaching the
    File constructor at 100-101 is request.getParameter("id"), which is URL-decoded. So
    ?id=%2e%2e%2fpath-traversal-secret.jpg holds neither ".." nor "/" literally, passes
    the check, and arrives decoded as a traversal. WebGoat states the intent:
    PathTraversal_retrieval.adoc sets the assignment as finding
    path-traversal-secret.jpg, and line 103 of this file branches on that having
    worked. Previously labelled safe as c-59e43f3e, which charged a false positive
    against any tool that found it; corrected after the positive control flagged it.
